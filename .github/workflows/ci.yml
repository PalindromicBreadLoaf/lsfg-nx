name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  host:
    name: Host checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: cmake --preset host-debug

      - name: Build
        run: cmake --build --preset host-debug

      - name: Test
        run: ctest --preset host-debug

  switch:
    name: Switch build
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y cmake ninja-build

      - name: Install Switch packages
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm --needed \
            deko3d switch-curl switch-zlib switch-mbedtls

      - name: Configure
        run: cmake --preset switch-release
        env:
          DEVKITPRO: /opt/devkitpro

      - name: Build
        run: cmake --build --preset switch-package
        env:
          DEVKITPRO: /opt/devkitpro

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sd-package
          path: build/switch-release/sd-package/
          if-no-files-found: error

  license-headers:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every source file carries the header
        run: ./scripts/check-license-headers.sh
